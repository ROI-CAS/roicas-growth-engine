services:
  relay:
    image: nginx:1.28-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    cpus: 0.1
    mem_limit: 64m
    pids_limit: 32
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,size=8m
      - /var/run:uid=101,gid=101,size=1m
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - host.docker.internal:${WPDOCTOR_PROXY_GATEWAY:?Dedicated bridge gateway required}
    networks: [wpdoctor_proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=wpdoctor_proxy
      - traefik.http.routers.wpdoctor-runner.rule=Host(`runner.srv1162733.hstgr.cloud`)
      - traefik.http.routers.wpdoctor-runner.entrypoints=websecure
      - traefik.http.routers.wpdoctor-runner.tls.certresolver=mytlschallenge
      - traefik.http.services.wpdoctor-runner.loadbalancer.server.port=8080
networks:
  wpdoctor_proxy:
    external: true
