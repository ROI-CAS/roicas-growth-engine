<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#111022" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#252440" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg2)" />
  <rect width="1200" height="750" fill="url(#grid2)" />

  <circle cx="280" cy="200" r="320" fill="url(#purpleGlow)" />
  <circle cx="950" cy="500" r="300" fill="url(#cyanGlow)" />

  <!-- Main Floating Workflow Card -->
  <g transform="translate(140, 100)">
    <rect width="920" height="550" rx="24" fill="#0A0E17" opacity="0.4" transform="translate(0, 16)" />
    <rect width="920" height="550" rx="24" fill="#131422" stroke="#2D2C4D" stroke-width="1.5" />

    <!-- Window Bar -->
    <rect width="920" height="54" rx="24" fill="#1A1A2E" />
    <circle cx="36" cy="27" r="6" fill="#EF4444" />
    <circle cx="56" cy="27" r="6" fill="#F59E0B" />
    <circle cx="76" cy="27" r="6" fill="#10B981" />
    <text x="460" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#A5B4FC" text-anchor="middle">ROICAS AI Automation Pipeline • Flujo Autónomo de Calificación</text>

    <!-- Node 1: WhatsApp Inbound -->
    <g transform="translate(60, 110)">
      <rect width="230" height="150" rx="16" fill="#1E1E36" stroke="#25D366" stroke-width="1.5" />
      <circle cx="38" cy="40" r="14" fill="#25D366" fill-opacity="0.2" />
      <text x="38" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#25D366" text-anchor="middle">W</text>
      <text x="64" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">1. Lead Entrante</text>
      <text x="64" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#A5B4FC">WhatsApp / Web</text>
      <rect x="20" y="80" width="190" height="48" rx="8" fill="#141424" />
      <text x="30" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E2E8F0">"Hola, busco cotizar</text>
      <text x="30" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E2E8F0">sistema para 10 sedes"</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 290 185 L 345 185" fill="none" stroke="url(#flowLine)" stroke-width="3" stroke-dasharray="6,4" />
    <polygon points="345,180 355,185 345,190" fill="#06B6D4" />

    <!-- Node 2: AI Qualification Agent -->
    <g transform="translate(355, 110)">
      <rect width="240" height="150" rx="16" fill="#1E1E36" stroke="#8B5CF6" stroke-width="2" />
      <circle cx="38" cy="40" r="14" fill="#8B5CF6" fill-opacity="0.2" />
      <text x="38" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#C084FC" text-anchor="middle">AI</text>
      <text x="64" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">2. Agente Inteligente</text>
      <text x="64" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#C084FC">Calificación en 3 seg</text>
      <rect x="20" y="80" width="200" height="48" rx="8" fill="#141424" />
      <text x="30" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#10B981">✓ Presupuesto validado</text>
      <text x="30" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#38BDF8">✓ Decisor B2B confirmado</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 595 185 L 650 185" fill="none" stroke="url(#flowLine)" stroke-width="3" stroke-dasharray="6,4" />
    <polygon points="650,180 660,185 650,190" fill="#10B981" />

    <!-- Node 3: CRM & Booking Sync -->
    <g transform="translate(660, 110)">
      <rect width="200" height="150" rx="16" fill="#1E1E36" stroke="#10B981" stroke-width="1.5" />
      <circle cx="38" cy="40" r="14" fill="#10B981" fill-opacity="0.2" />
      <text x="38" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">✓</text>
      <text x="64" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">3. Cita Agendada</text>
      <text x="64" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#86EFAC">Notion / HubSpot</text>
      <rect x="20" y="80" width="160" height="48" rx="8" fill="#141424" />
      <text x="30" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#FFFFFF">Reunión fijada</text>
      <text x="30" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Jueves 10:00 AM</text>
    </g>

    <!-- Bottom Metrics Row -->
    <g transform="translate(60, 310)">
      <!-- Box 1 -->
      <rect width="250" height="180" rx="16" fill="#1A1A2E" stroke="#2D2C4D" stroke-width="1" />
      <text x="24" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#A5B4FC">TIEMPO DE RESPUESTA</text>
      <text x="24" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#06B6D4">&lt; 5 s</text>
      <text x="24" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0">Atención activa 24/7</text>
      <text x="24" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Sin esperas ni leads fríos</text>

      <!-- Box 2 -->
      <g transform="translate(275, 0)">
        <rect width="250" height="180" rx="16" fill="#1A1A2E" stroke="#2D2C4D" stroke-width="1" />
        <text x="24" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#A5B4FC">HORAS AHORRADAS</text>
        <text x="24" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#8B5CF6">20 h</text>
        <text x="24" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0">Por semana por asesor</text>
        <text x="24" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Eliminación de tareas repetitivas</text>
      </g>

      <!-- Box 3 -->
      <g transform="translate(550, 0)">
        <rect width="250" height="180" rx="16" fill="#1A1A2E" stroke="#B51828" stroke-width="1.2" />
        <text x="24" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F87171">EFECTIVIDAD DE CIERRE</text>
        <text x="24" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#10B981">+390%</text>
        <text x="24" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0">Contacto en los 1os 5 min</text>
        <text x="24" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Probabilidad de venta disparada</text>
      </g>
    </g>
  </g>
</svg>

