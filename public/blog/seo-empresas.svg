<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#14110A" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2D2311" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#bg3)" />
  <rect width="1200" height="750" fill="url(#grid3)" />

  <circle cx="300" cy="220" r="320" fill="url(#amberGlow)" />
  <circle cx="950" cy="500" r="280" fill="#B51828" fill-opacity="0.15" />

  <g transform="translate(140, 100)">
    <rect width="920" height="550" rx="24" fill="#0A0E17" opacity="0.4" transform="translate(0, 16)" />
    <rect width="920" height="550" rx="24" fill="#14151D" stroke="#332B1A" stroke-width="1.5" />

    <!-- Window Bar -->
    <rect width="920" height="54" rx="24" fill="#1C1B24" />
    <circle cx="36" cy="27" r="6" fill="#EF4444" />
    <circle cx="56" cy="27" r="6" fill="#F59E0B" />
    <circle cx="76" cy="27" r="6" fill="#10B981" />
    <text x="460" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FDE68A" text-anchor="middle">ROICAS Organic Growth Dashboard • Google Search Console Analytics</text>

    <!-- Top SERP Search Mockup -->
    <g transform="translate(48, 86)">
      <rect width="824" height="60" rx="14" fill="#0D0E14" stroke="#453416" stroke-width="1.2" />
      <circle cx="36" cy="30" r="10" fill="none" stroke="#F59E0B" stroke-width="2" />
      <line x1="43" y1="37" x2="52" y2="46" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
      <text x="68" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#FFFFFF">servicios de climatización industrial en bogotá</text>
      <rect x="670" y="14" width="138" height="32" rx="8" fill="#F59E0B" fill-opacity="0.2" />
      <text x="739" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">#1 Posición Orgánica</text>
    </g>

    <!-- Chart + Ranking metrics -->
    <g transform="translate(48, 170)">
      <!-- Main Growth Chart -->
      <rect width="520" height="330" rx="16" fill="#0D0E14" stroke="#25222E" stroke-width="1" />
      <text x="24" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Evolución de Clics e Impresiones Orgánicas</text>
      <text x="24" y="56" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">Últimos 6 meses • Tráfico con alta intención comercial</text>

      <!-- SVG Chart Line & Area -->
      <g transform="translate(24, 80)">
        <path d="M 0 180 Q 80 160 140 140 T 260 90 T 360 40 T 470 10 L 470 200 L 0 200 Z" fill="url(#chartGrad)" />
        <path d="M 0 180 Q 80 160 140 140 T 260 90 T 360 40 T 470 10" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />

        <!-- Data points -->
        <circle cx="140" cy="140" r="5" fill="#F59E0B" />
        <circle cx="260" cy="90" r="5" fill="#F59E0B" />
        <circle cx="360" cy="40" r="5" fill="#F59E0B" />
        <circle cx="470" cy="10" r="7" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3" />

        <!-- Callout on top point -->
        <rect x="360" y="-30" width="110" height="28" rx="6" fill="#F59E0B" />
        <text x="415" y="-12" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#000000" text-anchor="middle">+185% Tráfico</text>
      </g>
    </g>

    <!-- Side Metrics -->
    <g transform="translate(590, 170)">
      <!-- Metric 1: Top 3 Keywords -->
      <rect width="282" height="98" rx="16" fill="#0D0E14" stroke="#25222E" stroke-width="1" />
      <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">KEYWORDS EN TOP 3</text>
      <text x="20" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#F59E0B">342</text>
      <text x="120" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#10B981">↑ +84 este mes</text>

      <!-- Metric 2: Monthly Impressions -->
      <g transform="translate(0, 116)">
        <rect width="282" height="98" rx="16" fill="#0D0E14" stroke="#25222E" stroke-width="1" />
        <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">IMPRESIONES ORGÁNICAS</text>
        <text x="20" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">85.6 K</text>
        <text x="160" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#10B981">/ mes</text>
      </g>

      <!-- Metric 3: Cost per Lead -->
      <g transform="translate(0, 232)">
        <rect width="282" height="98" rx="16" fill="#0D0E14" stroke="#B51828" stroke-width="1.2" />
        <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#F87171">COSTE POR LEAD ORGÁNICO</text>
        <text x="20" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#10B981">$0 COP</text>
        <text x="160" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8">Tráfico propio</text>
      </g>
    </g>
  </g>
</svg>

